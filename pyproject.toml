[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-lens"
version = "0.1.0"
description = "Offline Windows code impact analysis and test recommendation"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8,<7", "scikit-learn>=1.6,<1.8", "rope>=1.15,<2", "jedi>=0.20,<0.21",
  "black==26.5.1", "Pygments==2.21.0", "tree-sitter==0.25.2",
  "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2",
  "tree-sitter-java==0.23.5", "tree-sitter-c-sharp==0.23.5",
  "tree-sitter-go==0.25.0", "tree-sitter-rust==0.24.2", "tree-sitter-dart==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
change-lens = "changelens.workbench:main"

[tool.setuptools.packages.find]
include = ["changelens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

